name: Point-in-Time Snapshot

# WHY THIS EXISTS. Several data sources return CURRENT STATE ONLY, not as-of-date
# history — short-position registers, ClinicalTrials.gov, and Companies House all tell
# you what is true today and nothing about what was true last month. The research report
# is explicit: "you must snapshot them forward to preserve point-in-time correctness; do
# not trust their present values in historical backtests."
#
# That inverts the usual priority. For these sources the value comes from WHEN CAPTURE
# STARTS, not when the features get used — every week without a snapshot is a week of
# history that can never be reconstructed. So this runs now, even though the features
# themselves are deliberately NOT being wired until after the September checkpoint
# (wiring them would require a retrain, which would reset the very checkpoint that is
# currently accumulating evidence about v9.4).
#
# STORAGE. The artifacts are already git-tracked, so committing a refreshed file IS the
# dated snapshot — git history becomes the point-in-time record with no new
# infrastructure, no database, and nothing that can silently fail to persist. Recover any
# past state with `git log --follow -- src/scripts/<file>.json`.
#
# DELIBERATELY EXCLUDED. Sources that are already historical by nature (SEC filings and
# fundamentals, HKEX/EDINET announcements — each record carries its own filing date) or
# effectively static (OpenFIGI, LEI). Re-snapshotting those would add megabytes per week
# to the repo for no point-in-time gain; the five here total ~230 KB.
#
# TOUCHES NO MODEL. No feature, no retrain, no trial, no effect on live inference.

on:
  schedule:
    # Sunday 06:00 UTC — clear of the Mon-Fri live-inference runs (07:00/15:30/20:00)
    # and of the 21:30 outcome-tracker job.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write   # needs to commit the refreshed snapshots

concurrency:
  group: pit-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Each builder runs independently and one failure does not stop the others: one
      # dead endpoint should not cost the week's snapshot for the other four. But a
      # failure is NO LONGER swallowed into a warning nobody reads -- ClinicalTrials
      # failed silently for 3+ straight weeks that way (fixed 03a0aaa). Every failure
      # is recorded and the JOB goes red at the end, after the successful sources have
      # still been committed.
      - name: FCA short positions (UK)
        run: npx tsx src/scripts/buildFcaShortPositions.ts || echo "FCA" >> pit_failures.txt

      - name: AMF short positions (France)
        run: npx tsx src/scripts/buildAmfShortPositions.ts || echo "AMF" >> pit_failures.txt

      - name: FINRA short interest (US)
        run: npx tsx src/scripts/buildShortInterest.ts || echo "FINRA" >> pit_failures.txt

      - name: ClinicalTrials.gov
        run: npx tsx src/scripts/buildClinicalTrials.ts || echo "ClinicalTrials" >> pit_failures.txt

      # FINRA archives these daily files publicly to 2009, so unlike the registers
      # above this is a serving-parity snapshot, not irreplaceable capture — but the
      # weekly refresh keeps a current 1d/5d/20d off-exchange short ratio per US
      # universe symbol ready for the retrain that wires it.
      - name: FINRA daily short-sale volume
        run: npx tsx src/scripts/buildShortVolume.ts || echo "ShortVolume" >> pit_failures.txt

      # Only source here needing a key. Skipped rather than failed when absent, so the
      # workflow still works for anyone without the secret configured.
      - name: Companies House status (UK)
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: |
          if [ -z "$COMPANIES_HOUSE_API_KEY" ]; then
            echo "::notice::COMPANIES_HOUSE_API_KEY not set — skipping UK company status"
          else
            npx tsx src/scripts/buildUkCompanyStatus.ts || echo "CompaniesHouse" >> pit_failures.txt
          fi

      # APPEND-ONLY, unlike the five above. These are dated events merged on accession,
      # so re-running adds rather than replaces and only genuinely new filings are
      # fetched — the weekly cost after the first run is small. Also refreshes the
      # accumulated CIK->ticker map, which has to be captured BEFORE a delisting because
      # the SEC prunes delisted companies from company_tickers.json.
      - name: SEC Form 25 delistings + CIK/ticker map
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          if [ -z "$SEC_CONTACT" ]; then
            echo "::notice::SEC_CONTACT not set — skipping delisting capture"
          else
            npx tsx src/scripts/buildDelistings.ts || echo "Delistings" >> pit_failures.txt
          fi

      # Free primary-source replacement-in-waiting for the stale-frozen FMP
      # insider_net_shares_30d feature. EDGAR is permanent (backfillable), so the
      # artifact keeps a rolling 45d ledger + 30d aggregates, not full history.
      - name: SEC Form 4 insider transactions
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          if [ -z "$SEC_CONTACT" ]; then
            echo "::notice::SEC_CONTACT not set — skipping Form 4 capture"
          else
            npx tsx src/scripts/buildInsiderForm4.ts || echo "Form4" >> pit_failures.txt
          fi

      # Weekly diff of the SEC registered-ticker feed: genuinely NEW NYSE/Nasdaq
      # listings that pass liquidity gates are auto-admitted to the scan universe via
      # src/autoListings.json (merged into GLOBAL_MARKETS at load — CI commits JSON
      # only). New admissions carry no enrichment, so they are quarantined by
      # unreliable_reason='null_enrichment' like the rest of the expansion cohort.
      - name: New-listings watcher
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          if [ -z "$SEC_CONTACT" ]; then
            echo "::notice::SEC_CONTACT not set — skipping new-listings watcher"
          else
            npx tsx src/scripts/buildNewListings.ts || echo "NewListings" >> pit_failures.txt
          fi

      - name: Commit the snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only paths that EXIST. git exits 128 if any pathspec matches nothing,
          # and it does so before staging anything -- so one absent file discards all the
          # others. Run 2 (2026-08-11) died exactly this way on src/autoListings.json,
          # which the new-listings watcher only writes when it ADMITS a listing; admitting
          # nothing is its normal state, so every run would have captured everything and
          # committed nothing until some future admission happened to create the file.
          # Must be `if; then; fi` and NOT `[ -e "$f" ] && git add`: steps run under
          # `bash -e`, so a false test on the LAST iteration returns non-zero and fails the
          # step -- the same bug wearing a different hat. This does not hide a broken
          # source: a failing builder is still recorded to pit_failures.txt and reported
          # by the final step.
          for f in src/scripts/symbol_fca_short_positions.json \
                   src/scripts/symbol_amf_short_positions.json \
                   src/scripts/symbol_short_interest.json \
                   src/scripts/symbol_clinical_trials.json \
                   src/scripts/symbol_uk_company_status.json \
                   src/scripts/symbol_delistings.json \
                   src/scripts/cik_ticker_map.json \
                   src/scripts/new_listings_state.json \
                   src/autoListings.json \
                   src/scripts/symbol_short_volume.json \
                   src/scripts/symbol_insider_form4.json; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no changes — sources reported identical state, nothing to snapshot"
            exit 0
          fi
          echo "changed files:"
          git diff --cached --name-only
          # [skip ci] so this commit does not trigger other workflows
          git commit -m "chore: point-in-time snapshot $(date -u +%Y-%m-%d) [skip ci]" \
                     -m "Automated weekly capture of current-state-only sources. Git history is the
          point-in-time record — these feeds return present state, so a value is only
          attributable to a date because of when it was committed. Not wired as features
          (that needs a retrain, deferred past the September checkpoint)."
          git push

      # Runs AFTER the commit so the successful sources' snapshots are never lost to a
      # sibling's failure — but the run itself goes red, which is the only signal that
      # actually gets looked at. Every week a source silently fails is a week of
      # unrecoverable point-in-time history.
      #
      # `if: always()` because Actions skips remaining steps once one fails -- so without
      # it this step is skipped exactly when something broke. Run 2 showed the failure
      # mode: the commit step failed and this one never ran, leaving a red job with no
      # indication of whether the nine capture steps were fine (they were).
      - name: Fail if any source failed
        if: always()
        run: |
          if [ -f pit_failures.txt ]; then
            echo "::error::sources that failed this run: $(paste -sd ', ' pit_failures.txt)"
            exit 1
          fi
          echo "all sources succeeded"
