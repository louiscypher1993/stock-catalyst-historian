name: Live Inference

on:
  schedule:
    # 8:00 AM BST (7:00 UTC) — pre-market London open
    - cron: '0 7 * * 1-5'
    # 4:30 PM BST (15:30 UTC) — post-market London close
    - cron: '30 15 * * 1-5'
    # 9:00 PM BST (20:00 UTC) — post US market close
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

# Prevent overlapping evaluateRun executions -- two concurrent runs (one
# schedule-triggered ~3.5h late, one manual workflow_dispatch) raced for 57s
# on 2026-07-09 and one of them silently dropped pot_snapshots writes for
# 7/20 pots (transient write contention during the overlap, not a decidePot
# bug -- see that day's investigation). Static group name (not scoped to
# ref/branch) so ANY two runs of this workflow are mutually exclusive
# regardless of trigger type. cancel-in-progress: false -- a queued run
# should wait and run after the in-progress one finishes, not get cancelled
# and skip its cycle (a skipped cycle means a missed price check and missed
# patience-timeout evaluation for every pot, which is worse than a delay).
concurrency:
  group: live-inference
  cancel-in-progress: false

jobs:
  infer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install xgboost scikit-learn pandas numpy

      - name: Determine run slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 7 * * 1-5")   echo "slot=morning"   >> $GITHUB_OUTPUT ;;
            "30 15 * * 1-5") echo "slot=afternoon"  >> $GITHUB_OUTPUT ;;
            "0 20 * * 1-5")  echo "slot=evening"    >> $GITHUB_OUTPUT ;;
            *)                echo "slot=afternoon"  >> $GITHUB_OUTPUT ;;
          esac

      - name: Run live inference
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PIPELINE_RUN_SLOT: ${{ steps.slot.outputs.slot }}
          # OBSERVATION ONLY — decisions still come from the SPY path exactly as before.
          # Alongside them, the native-per-market benchmark verdict is computed and any
          # DISAGREEMENT about whether a bar is an anomaly is written to
          # shadow_benchmark_divergence. Switching live to 'native' would change ~33% of
          # detections (only 67% overlap, measured in scratch_v12_live_shadow.py), and
          # backtest cannot say which set performs better — this accumulates the live
          # evidence to decide. To revert: delete this one line.
          LIVE_BENCHMARK_MODE: shadow
          # Model C v9.5 — drops the 16,435 pre-2021 rows whose max_adverse_excursion_1m
          # was built from MONTHLY/QUARTERLY bars, plus one label outlier (III.L, a
          # +113.54 GBp/GBP scale artefact that v9.4's filter cannot catch because it
          # keys on gap/excess_return, never on the label). Measured over 4 folds against
          # the deployed model: day-clustered rank IC +0.3333 -> +0.3537, paired t=5.15
          # on 765 shared test days — the first result on this project to clear the
          # Harvey-Liu-Zhu t>3 hurdle.
          #
          # THE VISIBLE CHANGE IS CALIBRATION, NOT RANKING. v9.1 reported a POSITIVE max
          # drawdown — i.e. "never trades below entry" — on 84.3% of anomalies, because
          # early stopping fired at iteration 24 of 1000 and left it stranded above
          # base_score=0.5. v9.5 does so on 0.0%. The percentile RANK barely moves (on
          # TRIP 2025-06-25 the riskScore drawdown term goes 24.1 -> 24.9 of 40), so
          # position sizing shifts only slightly; what changes materially is the number
          # printed to the user (LiveInferenceService.ts:866) and handed to the LLM (:922).
          #
          # infer.py emits model_c_percentile_rank + model_c_version alongside the
          # prediction, computed against the breakpoints of the version it loaded, so a
          # model can never be served against another version's table (that mismatch is
          # worth ~18 riskScore points). An unknown version refuses to start.
          # Verified by src/scripts/verifyModelCParity.ts: Python/TypeScript rank parity
          # 0.000e+0 over 2,399 probes; unset => v9.1 byte-for-byte.
          #
          # NOTE: this does NOT touch the September IC checkpoint (model_c appears in no
          # part of outcomeTracker/outcomeScoreboard/readoutHarness/dsrPboAudit), but it
          # DOES shift pot-ledger position sizing from here on.
          # To revert: delete this one line — the code then takes the '9.1' default.
          MODEL_C_VERSION: '9.5'
        run: npx tsx src/LiveInferenceService.ts
