<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalyst Historian — Live Signals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0e17;
    --panel: #131a26;
    --panel-border: #1f2937;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #22c55e;
    --green-bg: rgba(34, 197, 94, 0.12);
    --amber: #f59e0b;
    --amber-bg: rgba(245, 158, 11, 0.12);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--panel-border);
  }

  header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  #last-updated {
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }

  main {
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  #results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 64px 16px;
    font-size: 1.05rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 4px solid var(--muted);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card.green  { border-left-color: var(--green); }
  .card.amber  { border-left-color: var(--amber); }
  .card.red    { border-left-color: var(--red); }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .symbol-block .symbol {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .symbol-block .company {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }

  .badge {
    flex-shrink: 0;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }

  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.amber { background: var(--amber-bg); color: var(--amber); }
  .badge.red   { background: var(--red-bg); color: var(--red); }

  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .stat {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .stat .label {
    color: var(--muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }

  .stat .value {
    font-size: 1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .value.positive { color: var(--green); }
  .value.negative { color: var(--red); }

  .narrative {
    color: var(--text);
    font-size: 0.88rem;
    line-height: 1.5;
    border-top: 1px solid var(--panel-border);
    padding-top: 12px;
    margin: 0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 24px;
  }

  @media (max-width: 480px) {
    header { padding: 16px 16px 12px; }
    main { padding: 16px; }
    #results { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Catalyst Historian</h1>
      <p class="subtitle">AI-generated trading signals — updated pre-market &amp; post-close</p>
    </div>
    <div id="last-updated">Last updated: —</div>
  </header>

  <main>
    <div id="results">
      <p class="empty">Loading signals…</p>
    </div>
  </main>

  <footer>
    Automated model output for research purposes only. Not financial advice.
  </footer>

<script>
  const SUPABASE_URL = 'https://oxlpjchnwkmpowsjysad.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_0AfNLab0AtHYye5VHb6laQ_swJZf7TY';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const REC_COLOR = {
    STRONG_BUY: 'green',
    BUY: 'green',
    ADD: 'amber',
    HOLD: 'amber',
    REDUCE: 'red',
    SELL: 'red',
  };

  function pct(x, digits = 2) {
    if (x === null || x === undefined) return '—';
    const v = (x * 100).toFixed(digits);
    return (x > 0 ? '+' : '') + v + '%';
  }

  function returnClass(v) {
    return v > 0 ? 'positive' : (v < 0 ? 'negative' : '');
  }

  function renderCard(r) {
    const colorClass = REC_COLOR[r.recommendation] || 'amber';
    const returnVal = r.model_b_return_1m;
    const company = r.company_name ? `${r.company_name}${r.exchange ? ' · ' + r.exchange : ''}` : (r.exchange || '');

    return `
      <div class="card ${colorClass}">
        <div class="card-header">
          <div class="symbol-block">
            <div class="symbol">${r.symbol}</div>
            ${company ? `<div class="company">${company}</div>` : ''}
          </div>
          <div class="badge ${colorClass}">${r.recommendation.replace('_', ' ')}</div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="label">Expected Return (2D)</div>
            <div class="value ${returnClass(r.model_d3_return_2d)}">${pct(r.model_d3_return_2d)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (3D)</div>
            <div class="value ${returnClass(r.model_d4_return_3d)}">${pct(r.model_d4_return_3d)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (2W)</div>
            <div class="value ${returnClass(r.model_d5_return_2w)}">${pct(r.model_d5_return_2w)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (1M)</div>
            <div class="value ${returnClass(returnVal)}">${pct(returnVal)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (3M)</div>
            <div class="value ${returnClass(r.model_d1_return_3m)}">${pct(r.model_d1_return_3m)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (6M)</div>
            <div class="value ${returnClass(r.model_d2_return_6m)}">${pct(r.model_d2_return_6m)}</div>
          </div>
          <div class="stat">
            <div class="label">12M Outperform Prob.</div>
            <div class="value">${r.model_e_outperform_12m_prob != null ? (r.model_e_outperform_12m_prob * 100).toFixed(1) + '%' : '—'}</div>
          </div>
          <div class="stat">
            <div class="label">Risk Score</div>
            <div class="value">${r.risk_score ?? '—'} / 100</div>
          </div>
          <div class="stat">
            <div class="label">Risk / Reward</div>
            <div class="value">${r.risk_reward_ratio != null ? r.risk_reward_ratio.toFixed(2) + 'x' : '—'}</div>
          </div>
          <div class="stat">
            <div class="label">Position Size</div>
            <div class="value">${r.position_size_pct != null ? r.position_size_pct.toFixed(1) + '%' : '—'}</div>
          </div>
        </div>
        ${r.narrative ? `<p class="narrative">${r.narrative}</p>` : ''}
      </div>
    `;
  }

  async function loadResults() {
    const container = document.getElementById('results');
    const today = new Date().toISOString().split('T')[0];

    const { data, error } = await sb
      .from('inference_results')
      .select('*')
      .eq('run_date', today)
      .order('model_a_confidence', { ascending: false });

    if (error) {
      container.innerHTML = `<p class="empty">Error loading signals: ${error.message}</p>`;
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = `<p class="empty">No signals detected today</p>`;
      return;
    }

    container.innerHTML = data.map(renderCard).join('');
  }

  document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleString()}`;
  loadResults();
</script>
</body>
</html>
