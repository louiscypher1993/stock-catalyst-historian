<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalyst Historian — Live Signals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0e17;
    --panel: #131a26;
    --panel-border: #1f2937;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #22c55e;
    --green-rgb: 34, 197, 94;
    --green-bg: rgba(34, 197, 94, 0.12);
    --green-400: #4ade80;
    --green-700: #15803d;
    --green-700-rgb: 21, 128, 61;
    --amber: #f59e0b;
    --amber-rgb: 245, 158, 11;
    --amber-bg: rgba(245, 158, 11, 0.12);
    --red: #ef4444;
    --red-rgb: 239, 68, 68;
    --red-bg: rgba(239, 68, 68, 0.12);
    --red-400: #f87171;
    --indigo: #6366f1;
    --indigo-rgb: 99, 102, 241;
    --indigo-bg: rgba(99, 102, 241, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--panel-border);
  }

  header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  #last-updated {
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .header-right-controls {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .run-now-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .run-now-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--indigo-bg);
    color: var(--indigo);
    border: 1px solid var(--indigo);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }

  .run-now-btn:hover:not(:disabled) {
    background: var(--indigo);
    color: #fff;
  }

  .run-now-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .run-now-label {
    color: #71717a;
    font-size: 10px;
  }

  .spinner {
    display: inline-block;
    width: 10px;
    height: 10px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    z-index: 1000;
  }

  .toast.hidden {
    display: none;
  }

  main {
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .panel-section {
    margin-bottom: 32px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }

  .section-header h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .dedup-toggle {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }

  .dedup-toggle:hover {
    border-color: var(--indigo);
    color: var(--indigo);
  }

  .watchlist-form {
    display: flex;
    gap: 8px;
  }

  .watchlist-form input {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 0.9rem;
    width: 160px;
  }

  .watchlist-form input:focus,
  .entry-price-input:focus {
    outline: none;
    border-color: var(--indigo);
  }

  .watchlist-form button {
    background: var(--indigo-bg);
    color: var(--indigo);
    border: 1px solid var(--indigo);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }

  .watchlist-form button:hover {
    background: var(--indigo);
    color: #fff;
  }

  .list-type-toggle {
    display: flex;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
  }

  .toggle-option {
    background: var(--panel);
    color: var(--muted);
    border: none;
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .toggle-option + .toggle-option {
    border-left: 1px solid var(--panel-border);
  }

  .toggle-option.active {
    background: var(--indigo-bg);
    color: var(--indigo);
  }

  .entry-price-input {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 0.9rem;
    width: 160px;
  }

  .entry-price-input.hidden {
    display: none;
  }

  .watchlist-group {
    margin-bottom: 24px;
  }

  .watchlist-group:last-child {
    margin-bottom: 0;
  }

  .section-subheader {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    font-size: 1rem;
    font-weight: 700;
  }

  .count-badge {
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .placeholder-empty {
    color: var(--muted);
    opacity: 0.5;
    font-size: 0.85rem;
    font-style: italic;
    padding: 16px;
    margin: 0;
  }

  .quality-banner,
  .offline-banner {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .quality-banner {
    background: rgba(120, 53, 15, 0.3);
    border: 1px solid #92400e;
    color: #fbbf24;
  }

  .offline-banner {
    background: var(--red-bg);
    border: 1px solid var(--red);
    color: var(--red-400);
  }

  .dismiss-btn {
    background: transparent;
    border: none;
    color: inherit;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }

  .watchlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .card.holding-card {
    border-left-color: var(--green-700);
  }

  .card.watching-card {
    border-left-color: var(--indigo);
  }

  .card.green.stale  { border-left-color: rgba(var(--green-rgb), 0.7); }
  .card.amber.stale  { border-left-color: rgba(var(--amber-rgb), 0.7); }
  .card.red.stale    { border-left-color: rgba(var(--red-rgb), 0.7); }
  .card.holding-card.stale  { border-left-color: rgba(var(--green-700-rgb), 0.7); }
  .card.watching-card.stale { border-left-color: rgba(var(--indigo-rgb), 0.7); }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }

  .date-badge {
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .price-block {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .price-line1 {
    font-size: 0.95rem;
    font-weight: 700;
  }

  .price-line2 {
    font-size: 0.75rem;
    font-weight: 600;
    margin-top: 2px;
  }

  .price-line2.price-up   { color: var(--green-400); }
  .price-line2.price-down { color: var(--red-400); }

  .remove-btn {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    border-radius: 6px;
    width: 28px;
    height: 28px;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
  }

  .remove-btn:hover {
    border-color: var(--red);
    color: var(--red);
  }

  .pending {
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
    margin: 0;
  }

  .quiet-day-badge {
    color: #a1a1aa;
    font-size: 0.75rem;
    margin-top: 4px;
  }

  #results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 64px 16px;
    font-size: 1.05rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 4px solid var(--muted);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card.green  { border-left-color: var(--green); }
  .card.amber  { border-left-color: var(--amber); }
  .card.red    { border-left-color: var(--red); }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .symbol-block .symbol {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .symbol-block .company {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }

  .badge {
    flex-shrink: 0;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }

  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.amber { background: var(--amber-bg); color: var(--amber); }
  .badge.red   { background: var(--red-bg); color: var(--red); }

  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .stat {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .stat .label {
    color: var(--muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }

  .stat .value {
    font-size: 1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .value.positive { color: var(--green); }
  .value.negative { color: var(--red); }

  .narrative {
    color: var(--text);
    font-size: 0.88rem;
    line-height: 1.5;
    border-top: 1px solid var(--panel-border);
    padding-top: 12px;
    margin: 0;
  }

  .edgar-filings {
    border-top: 1px solid #27272a;
    padding-top: 10px;
  }

  .edgar-filings-header {
    color: var(--muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .edgar-filing-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 0.75rem;
    padding: 2px 0;
  }

  .edgar-filing-date {
    color: #a1a1aa;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .edgar-filing-desc {
    color: #e4e4e7;
    flex: 1;
  }

  .edgar-filing-link {
    color: var(--muted);
    text-decoration: none;
    flex-shrink: 0;
  }

  .edgar-filing-link:hover {
    color: var(--text);
  }

  .edgar-filing-more {
    color: #71717a;
    font-size: 0.75rem;
    margin-top: 2px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 24px;
  }

  @media (max-width: 480px) {
    header { padding: 16px 16px 12px; }
    main { padding: 16px; }
    #results { grid-template-columns: 1fr; }
    .watchlist-grid { grid-template-columns: 1fr; }
    .watchlist-form { flex-wrap: wrap; }
    .watchlist-form input,
    .entry-price-input { width: 100%; }
    .list-type-toggle { width: 100%; }
    .toggle-option { flex: 1; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Catalyst Historian</h1>
      <p class="subtitle">AI-generated trading signals — updated pre-market &amp; post-close</p>
    </div>
    <div class="header-right-controls">
      <div id="last-updated">Last updated: —</div>
      <div class="run-now-wrap">
        <button id="run-now-btn" class="run-now-btn"><span id="run-now-text">⚡ Run Now</span></button>
        <div class="run-now-label">Local server only</div>
      </div>
    </div>
  </header>

  <main>
    <div id="server-offline-banner"></div>

    <section class="panel-section" id="watchlist-section">
      <div class="section-header">
        <h2>📋 Watchlist</h2>
        <form id="watchlist-form" class="watchlist-form">
          <input type="text" id="watchlist-input" placeholder="Add symbol (e.g. AAPL)" autocomplete="off" required>
          <div class="list-type-toggle" id="list-type-toggle">
            <button type="button" class="toggle-option active" data-value="watching">👁 Watching</button>
            <button type="button" class="toggle-option" data-value="holding">📊 Holding</button>
          </div>
          <input type="number" id="entry-price-input" class="entry-price-input hidden" placeholder="Entry price (optional)" step="0.01" min="0">
          <button type="submit">Add</button>
        </form>
      </div>

      <div id="quality-banner"></div>

      <div class="watchlist-group">
        <h3 class="section-subheader">📊 Holdings <span class="count-badge" id="holdings-count">0</span></h3>
        <div id="holdings-results" class="watchlist-grid">
          <p class="placeholder-empty">Loading…</p>
        </div>
      </div>

      <div class="watchlist-group">
        <h3 class="section-subheader">👁 Watching <span class="count-badge" id="watching-count">0</span></h3>
        <div id="watching-results" class="watchlist-grid">
          <p class="placeholder-empty">Loading…</p>
        </div>
      </div>
    </section>

    <section class="panel-section" id="signals-section">
      <div class="section-header">
        <h2>📡 Live Signals</h2>
        <button id="dedup-toggle" class="dedup-toggle">Latest per symbol</button>
      </div>
      <div id="results">
        <p class="empty">Loading signals…</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <footer>
    Automated model output for research purposes only. Not financial advice.
  </footer>

<script>
  const SUPABASE_URL = 'https://oxlpjchnwkmpowsjysad.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_0AfNLab0AtHYye5VHb6laQ_swJZf7TY';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const REC_COLOR = {
    STRONG_BUY: 'green',
    BUY: 'green',
    ADD: 'amber',
    HOLD: 'amber',
    REDUCE: 'red',
    SELL: 'red',
  };

  function pct(x, digits = 2) {
    if (x === null || x === undefined) return '—';
    const v = (x * 100).toFixed(digits);
    return (x > 0 ? '+' : '') + v + '%';
  }

  function returnClass(v) {
    return v > 0 ? 'positive' : (v < 0 ? 'negative' : '');
  }

  function formatDateBadge(runDate) {
    const today = new Date().toISOString().split('T')[0];
    const diffDays = Math.round((Date.parse(today) - Date.parse(runDate)) / 86400000);
    if (diffDays <= 0) return 'Today';
    if (diffDays === 1) return 'Yesterday';
    return `${diffDays}d ago`;
  }

  function isStale(runDate) {
    const today = new Date().toISOString().split('T')[0];
    const diffDays = Math.round((Date.parse(today) - Date.parse(runDate)) / 86400000);
    return diffDays > 3;
  }

  function formatPrice(symbol, price) {
    let prefix = '$';
    if (symbol.endsWith('.L')) prefix = '£';
    else if (['.PA', '.AS', '.DE', '.MI', '.MC'].some(suffix => symbol.endsWith(suffix))) prefix = '€';
    return `${prefix}${price.toFixed(2)}`;
  }

  function renderPriceBlock(r, entry) {
    if (r.current_price === null || r.current_price === undefined) return '';
    const priceStr = formatPrice(r.symbol, r.current_price);
    let changeLine = '';
    if (r.day_change_pct !== null && r.day_change_pct !== undefined) {
      const positive = r.day_change_pct >= 0;
      const arrow = positive ? '▲' : '▼';
      const sign = positive ? '+' : '−';
      changeLine = `<div class="price-line2 ${positive ? 'price-up' : 'price-down'}">${arrow} ${sign}${Math.abs(r.day_change_pct * 100).toFixed(1)}%</div>`;
    }
    let pnlLine = '';
    if (entry && entry.list_type === 'holding' && entry.entry_price !== null && entry.entry_price !== undefined) {
      const pnlPct = ((r.current_price - entry.entry_price) / entry.entry_price) * 100;
      const positive = pnlPct >= 0;
      const arrow = positive ? '▲' : '▼';
      const sign = positive ? '+' : '−';
      pnlLine = `<div class="price-line2 ${positive ? 'price-up' : 'price-down'}">P&amp;L ${arrow} ${sign}${Math.abs(pnlPct).toFixed(2)}%</div>`;
    }
    return `
      <div class="price-block">
        <div class="price-line1">${priceStr}</div>
        ${changeLine}
        ${pnlLine}
      </div>
    `;
  }

  function renderEdgarFilings(result) {
    if (!result || !result.edgar_8k_items) return '';
    let filings;
    try {
      filings = JSON.parse(result.edgar_8k_items);
    } catch {
      return '';
    }
    if (!Array.isArray(filings) || filings.length === 0) return '';

    const shown = filings.slice(0, 3);
    const extra = filings.length - shown.length;

    return `
      <div class="edgar-filings">
        <div class="edgar-filings-header">📋 SEC Filings</div>
        ${shown.map(f => `
          <div class="edgar-filing-row">
            <span class="edgar-filing-date">${f.date}</span>
            <span class="edgar-filing-desc">${f.description}</span>
            <a class="edgar-filing-link" href="${f.url}" target="_blank" rel="noopener noreferrer" title="View filing">↗</a>
          </div>
        `).join('')}
        ${extra > 0 ? `<div class="edgar-filing-more">+ ${extra} more</div>` : ''}
      </div>
    `;
  }

  function renderCard(r) {
    const colorClass = REC_COLOR[r.recommendation] || 'amber';
    const returnVal = r.model_b_return_1m;
    const company = r.company_name ? `${r.company_name}${r.exchange ? ' · ' + r.exchange : ''}` : (r.exchange || '');
    const stale = isStale(r.run_date);

    return `
      <div class="card ${colorClass}${stale ? ' stale' : ''}">
        <div class="card-header">
          <div class="symbol-block">
            <div class="symbol">${r.symbol}</div>
            ${company ? `<div class="company">${company}</div>` : ''}
          </div>
          <div class="header-right">
            <div class="badge ${colorClass}">${r.recommendation.replace('_', ' ')}</div>
            <div class="date-badge">${formatDateBadge(r.run_date)}</div>
          </div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="label">Expected Return (2D)</div>
            <div class="value ${returnClass(r.model_d3_return_2d)}">${pct(r.model_d3_return_2d)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (3D)</div>
            <div class="value ${returnClass(r.model_d4_return_3d)}">${pct(r.model_d4_return_3d)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (2W)</div>
            <div class="value ${returnClass(r.model_d5_return_2w)}">${pct(r.model_d5_return_2w)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (1M)</div>
            <div class="value ${returnClass(returnVal)}">${pct(returnVal)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (3M)</div>
            <div class="value ${returnClass(r.model_d1_return_3m)}">${pct(r.model_d1_return_3m)}</div>
          </div>
          <div class="stat">
            <div class="label">Expected Return (6M)</div>
            <div class="value ${returnClass(r.model_d2_return_6m)}">${pct(r.model_d2_return_6m)}</div>
          </div>
          <div class="stat">
            <div class="label">12M Outperform Prob.</div>
            <div class="value">${r.model_e_outperform_12m_prob != null ? (r.model_e_outperform_12m_prob * 100).toFixed(1) + '%' : '—'}</div>
          </div>
          <div class="stat">
            <div class="label">Risk Score</div>
            <div class="value">${r.risk_score ?? '—'} / 100</div>
          </div>
          <div class="stat">
            <div class="label">Risk / Reward</div>
            <div class="value">${r.risk_reward_ratio != null ? r.risk_reward_ratio.toFixed(2) + 'x' : '—'}</div>
          </div>
          <div class="stat">
            <div class="label">Position Size</div>
            <div class="value">${r.position_size_pct != null ? r.position_size_pct.toFixed(1) + '%' : '—'}</div>
          </div>
        </div>
        ${r.narrative ? `<p class="narrative">${r.narrative}</p>` : ''}
        ${renderEdgarFilings(r)}
      </div>
    `;
  }

  function renderWatchlistCard(entry, result) {
    const company = entry.company_name ? `${entry.company_name}${entry.exchange ? ' · ' + entry.exchange : ''}` : (entry.exchange || '');
    const cardTypeClass = entry.list_type === 'holding' ? 'holding-card' : 'watching-card';

    let body, dateBadge, priceBlock, stale = false;
    if (result) {
      stale = isStale(result.run_date);
      dateBadge = `<div class="date-badge">${formatDateBadge(result.run_date)}</div>`;
      priceBlock = renderPriceBlock(result, entry);
      const colorClass = REC_COLOR[result.recommendation] || 'amber';
      const isQuietDay = result.is_watchlist === true && Math.abs(result.z_score ?? 0) < 2.15;
      body = `
        <div class="card-header">
          <div>
            <div class="badge ${colorClass}">${result.recommendation.replace('_', ' ')}</div>
            ${isQuietDay ? `<div class="quiet-day-badge">〰 No anomaly · Directional only</div>` : ''}
          </div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="label">2D</div>
            <div class="value ${returnClass(result.model_d3_return_2d)}">${pct(result.model_d3_return_2d)}</div>
          </div>
          <div class="stat">
            <div class="label">3D</div>
            <div class="value ${returnClass(result.model_d4_return_3d)}">${pct(result.model_d4_return_3d)}</div>
          </div>
          <div class="stat">
            <div class="label">2W</div>
            <div class="value ${returnClass(result.model_d5_return_2w)}">${pct(result.model_d5_return_2w)}</div>
          </div>
          <div class="stat">
            <div class="label">1M</div>
            <div class="value ${returnClass(result.model_b_return_1m)}">${pct(result.model_b_return_1m)}</div>
          </div>
          <div class="stat">
            <div class="label">Risk Score</div>
            <div class="value">${result.risk_score ?? '—'} / 100</div>
          </div>
          <div class="stat">
            <div class="label">Trend</div>
            <div class="value">${result.trend_alignment ?? '—'}</div>
          </div>
        </div>
        ${renderEdgarFilings(result)}
      `;
    } else {
      dateBadge = '';
      priceBlock = '';
      body = `<p class="pending">No recent signal</p>`;
    }

    return `
      <div class="card ${cardTypeClass}${stale ? ' stale' : ''}">
        <div class="card-header">
          <div class="symbol-block">
            <div class="symbol">${entry.symbol}</div>
            ${company ? `<div class="company">${company}</div>` : ''}
          </div>
          <div class="header-right">
            ${priceBlock}
            ${dateBadge}
            <button class="remove-btn" data-symbol="${entry.symbol}" title="Remove from watchlist">✕</button>
          </div>
        </div>
        ${body}
      </div>
    `;
  }

  async function loadWatchlist() {
    const holdingsContainer = document.getElementById('holdings-results');
    const watchingContainer = document.getElementById('watching-results');
    const holdingsCount = document.getElementById('holdings-count');
    const watchingCount = document.getElementById('watching-count');

    const { data: entries, error } = await sb
      .from('watchlist')
      .select('*')
      .order('added_date', { ascending: false });

    if (error) {
      holdingsContainer.innerHTML = `<p class="empty">Error loading watchlist: ${error.message}</p>`;
      watchingContainer.innerHTML = '';
      holdingsCount.textContent = '0';
      watchingCount.textContent = '0';
      return;
    }

    const holdings = (entries || []).filter(e => e.list_type === 'holding');
    const watching = (entries || []).filter(e => e.list_type !== 'holding');

    holdingsCount.textContent = String(holdings.length);
    watchingCount.textContent = String(watching.length);

    const resultsBySymbol = {};
    const symbols = (entries || []).map(e => e.symbol);
    if (symbols.length > 0) {
      const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      const { data: results, error: resultsError } = await sb
        .from('inference_results')
        .select('*')
        .in('symbol', symbols)
        .gte('run_date', sevenDaysAgo)
        .order('run_date', { ascending: false });

      if (!resultsError && results) {
        results.forEach(r => {
          if (!resultsBySymbol[r.symbol]) resultsBySymbol[r.symbol] = r;
        });
      }
    }

    holdingsContainer.innerHTML = holdings.length > 0
      ? holdings.map(entry => renderWatchlistCard(entry, resultsBySymbol[entry.symbol])).join('')
      : `<p class="placeholder-empty">Nothing added yet</p>`;

    watchingContainer.innerHTML = watching.length > 0
      ? watching.map(entry => renderWatchlistCard(entry, resultsBySymbol[entry.symbol])).join('')
      : `<p class="placeholder-empty">Nothing added yet</p>`;
  }

  document.getElementById('list-type-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.toggle-option');
    if (!btn) return;
    document.querySelectorAll('#list-type-toggle .toggle-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const entryPriceInput = document.getElementById('entry-price-input');
    if (btn.dataset.value === 'holding') {
      entryPriceInput.classList.remove('hidden');
    } else {
      entryPriceInput.classList.add('hidden');
      entryPriceInput.value = '';
    }
  });

  document.getElementById('watchlist-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('watchlist-input');
    const symbol = input.value.trim().toUpperCase();
    if (!symbol) return;

    const listType = document.querySelector('#list-type-toggle .toggle-option.active').dataset.value;
    const entryPriceInput = document.getElementById('entry-price-input');
    const entryPrice = listType === 'holding' && entryPriceInput.value !== '' ? parseFloat(entryPriceInput.value) : null;

    try {
      const { error } = await sb
        .from('watchlist')
        .upsert(
          { symbol, company_name: symbol, list_type: listType, entry_price: entryPrice },
          { onConflict: 'symbol' }
        )
        .select()
        .single();
      if (error) throw new Error(error.message);
      input.value = '';
      entryPriceInput.value = '';
      await loadWatchlist();
    } catch (err) {
      alert(`Error adding ${symbol}: ${err.message}`);
    }
  });

  document.getElementById('watchlist-section').addEventListener('click', async (e) => {
    const btn = e.target.closest('.remove-btn');
    if (!btn) return;
    const symbol = btn.dataset.symbol;

    try {
      const { error } = await sb.from('watchlist').delete().eq('symbol', symbol);
      if (error) throw new Error(error.message);
      await loadWatchlist();
    } catch (err) {
      alert(`Error removing ${symbol}: ${err.message}`);
    }
  });

  let allResults = [];
  let dedupMode = true;

  function renderResults() {
    const container = document.getElementById('results');
    if (allResults.length === 0) {
      container.innerHTML = `<p class="empty">No signals detected in the last 7 days</p>`;
      return;
    }

    let rows = allResults;
    if (dedupMode) {
      const seen = new Set();
      rows = allResults.filter(r => {
        if (seen.has(r.symbol)) return false;
        seen.add(r.symbol);
        return true;
      });
    }

    container.innerHTML = rows.map(renderCard).join('');
  }

  function updateQualityBanner(avgCompleteness) {
    const container = document.getElementById('quality-banner');
    if (avgCompleteness >= 0.45) {
      container.innerHTML = '';
      return;
    }

    const pctStr = (avgCompleteness * 100).toFixed(0);
    container.innerHTML = `
      <div class="quality-banner">
        <div>⚠️ Signal quality degraded (avg completeness: ${pctStr}%) — FMP or enrichment data may be unavailable. Model outputs are less reliable until resolved.</div>
        <button class="dismiss-btn" id="quality-banner-dismiss">×</button>
      </div>
    `;
    document.getElementById('quality-banner-dismiss').addEventListener('click', () => {
      container.innerHTML = '';
    });
  }

  async function loadResults() {
    const container = document.getElementById('results');
    const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

    const { data, error } = await sb
      .from('inference_results')
      .select('*')
      .gte('run_date', sevenDaysAgo)
      .order('run_date', { ascending: false })
      .order('model_a_confidence', { ascending: false })
      .limit(150);

    if (error) {
      container.innerHTML = `<p class="empty">Error loading signals: ${error.message}</p>`;
      return;
    }

    allResults = data || [];
    renderResults();

    const threeDaysAgo = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
    const { data: recentResults } = await sb
      .from('inference_results')
      .select('signal_completeness_score')
      .gte('run_date', threeDaysAgo)
      .order('run_date', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(20);

    const recentScores = (recentResults || []).slice(0, 20)
      .map(r => r.signal_completeness_score)
      .filter(s => s != null);
    const avgCompleteness = recentScores.length > 0
      ? recentScores.reduce((a, b) => a + b, 0) / recentScores.length
      : 1;

    updateQualityBanner(avgCompleteness);
  }

  document.getElementById('dedup-toggle').addEventListener('click', () => {
    dedupMode = !dedupMode;
    document.getElementById('dedup-toggle').textContent = dedupMode ? 'Latest per symbol' : 'All signals';
    renderResults();
  });

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3000);
  }

  function showOfflineBanner() {
    const container = document.getElementById('server-offline-banner');
    container.innerHTML = `
      <div class="offline-banner">
        <span>Local server offline — trigger via GitHub Actions instead</span>
        <button class="dismiss-btn" id="offline-banner-dismiss">×</button>
      </div>
    `;
    document.getElementById('offline-banner-dismiss').addEventListener('click', () => {
      container.innerHTML = '';
    });
  }

  document.getElementById('run-now-btn').addEventListener('click', async () => {
    const btn = document.getElementById('run-now-btn');
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Running…`;

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 300000);
      const response = await fetch('http://localhost:3000/api/live-inference/run', {
        method: 'POST',
        signal: controller.signal,
      });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      await Promise.all([loadResults(), loadWatchlist()]);
      showToast('✓ Run complete');
    } catch (err) {
      showOfflineBanner();
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalHTML;
    }
  });

  document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleString()}`;
  loadWatchlist();
  loadResults();
</script>
</body>
</html>
